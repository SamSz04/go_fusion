model:
  hidden_dim: 128
  num_node_features: 19     # Continuous features (without opcode — opcode uses embedding)
  num_opcodes: 132           # Full XLA HLO opcode vocabulary size
  opcode_embed_dim: 32       # Learnable opcode embedding dimension
  num_gnn_layers: 2
  num_transformer_layers: 3
  num_attention_heads: 8
  segment_size: 256
  num_priorities: 20
  num_iterations: 3        # T=3 refinement iterations (non-autoregressive)
  ff_dim: 512
  dropout: 0.1

training:
  learning_rate: 1.0e-4
  clip_ratio: 0.2           # PPO clipping epsilon
  entropy_coeff: 0.01       # Entropy bonus coefficient
  value_loss_coeff: 0.5     # Value function loss coefficient
  max_grad_norm: 0.5        # Gradient clipping threshold
  num_epochs_per_update: 4  # PPO epochs per batch of rollouts
  rollouts_per_update: 16   # Episodes collected before each PPO update
  num_updates: 1000         # Total number of training updates
  checkpoint_interval: 50   # Save checkpoint every N updates
  log_interval: 10          # Log metrics every N updates

environment:
  gpu_target: "v100"        # Target GPU for performance model
  max_cluster_size: 64      # Maximum ops per fusion cluster
  num_priorities: 20        # Number of discrete priority levels (|F|)
  invalid_reward: -10.0     # Penalty for invalid fusion configurations

paths:
  hlo_dir: "../hlos"                # Directory containing .hlo files
  checkpoint_dir: "./checkpoints"   # Where to save model checkpoints
  log_dir: "./logs"                 # TensorBoard log directory
